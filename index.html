<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tic Tac Toe</title>
  <style>
    :root {
      --bg: #f4f5f7;
      --text: #222;
      --cell-bg: white;
      --cell-border: #ddd;
      --winner-bg: #c5f3d5;
      --winner-border: #3a9b60;
      --accent: #3455db;
      --timer-warning: #b42318;
    }

    :root[data-theme="dark"] {
      --bg: #14161a;
      --text: #eceef2;
      --cell-bg: #23262d;
      --cell-border: #3a3f49;
      --winner-bg: #1f5136;
      --winner-border: #4fc283;
      --accent: #5b78f0;
      --timer-warning: #ff8a80;
    }

    body {
      font-family: system-ui, sans-serif;
      text-align: center;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 60px 16px 40px;
      transition: background 0.2s, color 0.2s;
    }

    #theme-toggle {
      position: absolute;
      top: 16px;
      right: 16px;
      padding: 8px 14px;
      border: 2px solid var(--cell-border);
      border-radius: 999px;
      background: var(--cell-bg);
      color: var(--text);
      font-size: 14px;
      cursor: pointer;
    }

    #timer {
      font-size: 24px;
      font-weight: bold;
      font-variant-numeric: tabular-nums;
      margin: 16px 0;
    }

    #timer.warning {
      color: var(--timer-warning);
    }

    #board {
      display: grid;
      grid-template-columns: repeat(3, 90px);
      gap: 8px;
      justify-content: center;
      margin: 24px auto;
    }

    .cell {
      width: 90px;
      height: 90px;
      background: var(--cell-bg);
      border: 2px solid var(--cell-border);
      border-radius: 12px;
      font-size: 40px;
      color: var(--text);
      cursor: pointer;
    }

    .cell:disabled {
      cursor: default;
      opacity: 1;
    }

    .cell.winner {
      background: var(--winner-bg);
      border-color: var(--winner-border);
    }

    #restart {
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      background: var(--accent);
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <button id="theme-toggle" type="button" aria-label="Toggle dark mode">
    🌙 Dark
  </button>

  <h1>Tic Tac Toe</h1>
  <p id="status" aria-live="polite">X's turn</p>
  <p id="timer" role="timer">Time left: 2:00</p>
  <div id="board" aria-label="Tic tac toe board"></div>
  <button id="restart" type="button">Restart</button>

  <script>
    const boardElement = document.getElementById("board");
    const statusElement = document.getElementById("status");
    const timerElement = document.getElementById("timer");

    const winningLines = [
      [0, 1, 2], [3, 4, 5], [6, 7, 8],
      [0, 3, 6], [1, 4, 7], [2, 5, 8],
      [0, 4, 8], [2, 4, 6]
    ];

    const gameDuration = 120;

    let board;
    let player;
    let gameOver;
    let timerInterval;
    let deadline;

    function stopTimer() {
      clearInterval(timerInterval);
      timerInterval = null;
    }

    function updateTimer() {
      const secondsLeft = Math.max(
        0,
        Math.ceil((deadline - Date.now()) / 1000)
      );

      const minutes = Math.floor(secondsLeft / 60);
      const seconds = String(secondsLeft % 60).padStart(2, "0");

      timerElement.textContent = `Time left: ${minutes}:${seconds}`;
      timerElement.classList.toggle("warning", secondsLeft <= 30);

      if (secondsLeft === 0 && !gameOver) {
        gameOver = true;
        stopTimer();
        statusElement.textContent = "Time's up! Click Restart to play again.";
        render();
      }
    }

    function startTimer() {
      stopTimer();
      deadline = Date.now() + gameDuration * 1000;
      updateTimer();
      timerInterval = setInterval(updateTimer, 250);
    }

    function play(index) {
      if (gameOver || board[index]) return;

      // Check the deadline before accepting a move.
      updateTimer();
      if (gameOver) return;

      board[index] = player;

      const winningLine = winningLines.find(line =>
        line.every(position => board[position] === player)
      );

      if (winningLine) {
        gameOver = true;
        stopTimer();
        statusElement.textContent = `${player} wins!`;
      } else if (board.every(Boolean)) {
        gameOver = true;
        stopTimer();
        statusElement.textContent = "It's a draw!";
      } else {
        player = player === "X" ? "O" : "X";
        statusElement.textContent = `${player}'s turn`;
      }

      render(winningLine);
    }

    function render(winningLine = []) {
      boardElement.replaceChildren();

      board.forEach((mark, index) => {
        const cell = document.createElement("button");
        cell.type = "button";
        cell.className = "cell";
        cell.textContent = mark;
        cell.disabled = gameOver || Boolean(mark);
        cell.setAttribute(
          "aria-label",
          `Row ${Math.floor(index / 3) + 1}, column ${
            index % 3 + 1
          }: ${mark || "empty"}`
        );

        if (winningLine.includes(index)) {
          cell.classList.add("winner");
        }

        cell.addEventListener("click", () => play(index));
        boardElement.appendChild(cell);
      });
    }

    function restart() {
      board = Array(9).fill("");
      player = "X";
      gameOver = false;
      statusElement.textContent = "X's turn";
      render();
      startTimer();
    }

    document.getElementById("restart")
      .addEventListener("click", restart);

    // Keep the timer accurate when returning to the page.
    document.addEventListener("visibilitychange", () => {
      if (!document.hidden && !gameOver) {
        updateTimer();
      }
    });

    // Dark mode
    const themeToggle = document.getElementById("theme-toggle");

    function applyTheme(theme) {
      document.documentElement.dataset.theme = theme;
      themeToggle.textContent = theme === "dark" ? "☀️ Light" : "🌙 Dark";
      themeToggle.setAttribute(
        "aria-label",
        theme === "dark" ? "Switch to light mode" : "Switch to dark mode"
      );
    }

    function getSavedTheme() {
      try {
        return localStorage.getItem("theme");
      } catch (e) {
        return null;
      }
    }

    applyTheme(
      getSavedTheme() ||
      (window.matchMedia("(prefers-color-scheme: dark)").matches
        ? "dark"
        : "light")
    );

    themeToggle.addEventListener("click", () => {
      const next = document.documentElement.dataset.theme === "dark"
        ? "light"
        : "dark";

      applyTheme(next);

      try {
        localStorage.setItem("theme", next);
      } catch (e) {}
    });

    restart();
  </script>
</body>
</html>
